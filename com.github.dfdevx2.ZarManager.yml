app-id: com.github.dfdevx2.ZarManager
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
command: ZarManager
# DESATIVA A OTIMIZAÇÃO E COMPRESSÃO DE BINÁRIOS
build-options:
  strip: false
  no-debuginfo: true
finish-args:
  - --socket=x11
  - --socket=wayland
  - --share=ipc
  - --device=dri
  - --filesystem=host
modules:
  - name: zarmanager
    buildsystem: simple
    build-commands:
      - mkdir -p /app/bin
      - cp -r dist/ZarManager/* /app/bin/
      - chmod +x /app/bin/ZarManager
    sources:
      - type: dir
        path: .