name: Build Linux

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller customtkinter

    - name: Build with PyInstaller
      run: |
        pyinstaller --noconfirm --onedir --windowed --name "ZarManager" app.py

    - name: Make bins executable and copy
      run: |
        chmod +x bin/extract-xiso
        chmod +x bin/zarchive
        cp -r bin dist/ZarManager/

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ZarManager-Linux
        path: dist/ZarManager