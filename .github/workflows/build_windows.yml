name: Build Windows Executable

on:
  push:
    branches: [ "main", "master" ] # A ação será disparada quando você fizer um push para a branch main ou master
  workflow_dispatch: # Permite rodar a ação manualmente no GitHub

jobs:
  build:
    runs-on: windows-latest # Usa uma máquina virtual com Windows

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' # Define a versão do Python

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller customtkinter

    - name: Build with PyInstaller
      run: |
        pyinstaller --noconfirm --onedir --windowed --name "ZarManager" app.py

    - name: Copy bin folder to dist
      run: |
        xcopy /E /I /Y bin dist\ZarManager\bin

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ZarManager-Windows
        path: dist\ZarManager