name: Build and Release ZarManager

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build Executable
        run: pyinstaller ZarManager.spec
      - name: Create Zip Archive
        run: python -c "import shutil; shutil.make_archive('ZarManager-Windows', 'zip', 'dist/ZarManager')"
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Build
          path: ZarManager-Windows.zip

  build-linux:
    runs-on: ubuntu-20.04
    # DECLARAÇÃO GLOBAL DE NÃO INTERATIVIDADE PARA O APT-GET
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install System Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends python3-tk p7zip-full fuse libfuse2 desktop-file-utils wget
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build Executable
        run: pyinstaller ZarManager.spec
      - name: Create Linux Standard Zip
        run: python -c "import shutil; shutil.make_archive('ZarManager-Linux', 'zip', 'dist/ZarManager')"
      - name: Prepare AppImage Directory
        run: |
          mkdir -p AppDir/usr/bin
          cp -r dist/ZarManager/* AppDir/usr/bin/
          chmod +x AppDir/usr/bin/ZarManager
          
          cat <<EOF > AppDir/ZarManager.desktop
          [Desktop Entry]
          Type=Application
          Name=ZarManager
          Exec=ZarManager
          Icon=ZarManager
          Categories=Utility;
          Terminal=false
          EOF
          
          if [ -f img/icon.ico ]; then
            cp img/icon.ico AppDir/ZarManager.png
          else
            touch AppDir/ZarManager.png
          fi
          
          cat <<'EOF' > AppDir/AppRun
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          export LD_LIBRARY_PATH="${HERE}/usr/bin:${LD_LIBRARY_PATH}"
          exec "${HERE}/usr/bin/ZarManager" "$@"
          EOF
          chmod +x AppDir/AppRun
          
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run AppDir ZarManager-Linux-x86_64.AppImage
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Linux-Build
          path: |
            ZarManager-Linux.zip
            ZarManager-Linux-x86_64.AppImage

  create-release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Artifacts
        uses: actions/download-artifact@v4
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG.md
          files: |
            Windows-Build/ZarManager-Windows.zip
            Linux-Build/ZarManager-Linux.zip
            Linux-Build/ZarManager-Linux-x86_64.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}