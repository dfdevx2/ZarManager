name: Build and Release (Nuitka)

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: linux-assets
          - os: windows-latest
            artifact_name: windows-assets

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nuitka

      - name: Install Linux System Dependencies & FUSE for AppImage
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y patchelf ccache wget file libfuse2
          wget -c "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" -O appimagetool
          chmod +x appimagetool

      - name: Build with Nuitka (Linux Onefile)
        if: runner.os == 'Linux'
        run: |
          python -m nuitka --onefile --enable-plugin=pyside6 --lto=no --output-filename=ZarManager-Linux --output-dir=dist app.py
          
          # Criar estrutura AppDir para o AppImage
          mkdir -p AppDir/usr/bin AppDir/usr/share/icons/hicolor/256x256/apps AppDir/usr/share/applications
          
          cp dist/ZarManager-Linux AppDir/usr/bin/zarmanager
          cp img/icon.png AppDir/usr/share/icons/hicolor/256x256/apps/zarmanager.png
          cp img/icon.png AppDir/zarmanager.png
          
          cat << 'EOF' > AppDir/usr/share/applications/zarmanager.desktop
          [Desktop Entry]
          Type=Application
          Name=ZarManager
          Exec=zarmanager
          Icon=zarmanager
          Categories=Utility;
          EOF
          cp AppDir/usr/share/applications/zarmanager.desktop AppDir/
          
          cat << 'EOF' > AppDir/AppRun
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/zarmanager" "$@"
          EOF
          chmod +x AppDir/AppRun
          
          ./appimagetool AppDir dist/ZarManager-v1.0.0-x86_64.AppImage
          
          # Organizar numa pasta de assets limpa
          mkdir -p release_assets
          cp dist/ZarManager-Linux release_assets/
          cp dist/ZarManager-v1.0.0-x86_64.AppImage release_assets/

      - name: Build with Nuitka (Windows via MinGW64)
        if: runner.os == 'Windows'
        run: |
          python -m nuitka --onefile --enable-plugin=pyside6 --windows-console-mode=disable --assume-yes-for-downloads --lto=no --mingw64 --windows-icon-from-ico=img/icon.ico --windows-product-name="ZarManager" --windows-file-version="1.0.0.0" --windows-product-version="1.0.0.0" --windows-company-name="dfdevx2" --output-filename=ZarManager-Windows.exe --output-dir=dist app.py
          
          mkdir release_assets
          cp dist/ZarManager-Windows.exe release_assets/

      - name: Sign Windows Executable (Self-Signed Certificate)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=dfdevx2, O=ZarManager" -CertStoreLocation "Cert:\CurrentUser\My" -NotAfter (Get-Date).AddYears(5)
          Set-AuthenticodeSignature -FilePath "release_assets\ZarManager-Windows.exe" -Certificate $cert
          Write-Host "ZarManager-Windows.exe assinado com sucesso!"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release_assets/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release Draft with Changelog
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          prerelease: false
          name: ZarManager v1.0.0
          tag_name: v1.0.0
          files: |
            linux-assets/*
            windows-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}