name: Build and Release (Nuitka)

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: linux-assets
          - os: windows-latest
            artifact_name: windows-assets
          - os: macos-latest
            artifact_name: macos-assets

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nuitka

      - name: Nuitka Optimization Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/Nuitka
            ~/AppData/Local/Nuitka/Nuitka/Cache
            ~/Library/Caches/Nuitka
          key: ${{ runner.os }}-nuitka-${{ hashFiles('**/*.py') }}
          restore-keys: |
            ${{ runner.os }}-nuitka-

      - name: Install Linux System Dependencies & FUSE for AppImage
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y patchelf ccache wget file libfuse2
          wget -c "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" -O appimagetool
          chmod +x appimagetool

      - name: Build with Nuitka (Linux Onefile)
        if: runner.os == 'Linux'
        run: |
          python -m nuitka --onefile --enable-plugin=pyside6 --include-data-dir=bin=bin --lto=no --output-filename=ZarManager-Linux --output-dir=dist app.py
          
          mkdir -p AppDir/usr/bin AppDir/usr/share/icons/hicolor/256x256/apps AppDir/usr/share/applications
          
          cp dist/ZarManager-Linux AppDir/usr/bin/zarmanager
          cp img/icon.png AppDir/usr/share/icons/hicolor/256x256/apps/zarmanager.png
          cp img/icon.png AppDir/zarmanager.png
          
          cat << 'EOF' > AppDir/usr/share/applications/zarmanager.desktop
          [Desktop Entry]
          Type=Application
          Name=ZarManager
          Exec=zarmanager
          Icon=zarmanager
          Categories=Utility;
          EOF
          cp AppDir/usr/share/applications/zarmanager.desktop AppDir/
          
          cat << 'EOF' > AppDir/AppRun
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/zarmanager" "$@"
          EOF
          chmod +x AppDir/AppRun
          
          ./appimagetool AppDir dist/ZarManager-v1.2.0-x86_64.AppImage
          
          mkdir -p release_assets
          cp dist/ZarManager-Linux release_assets/
          cp dist/ZarManager-v1.2.0-x86_64.AppImage release_assets/

      - name: Build with Nuitka (Windows via MinGW64)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          python -m nuitka --standalone --enable-plugin=pyside6 --include-data-dir=bin=bin --windows-console-mode=disable --assume-yes-for-downloads --lto=no --mingw64 --windows-icon-from-ico=img/icon.ico --windows-product-name="ZarManager" --windows-file-version="1.2.0.0" --windows-product-version="1.2.0.0" --windows-company-name="dfdevx2" --output-dir=dist app.py
          
          Rename-Item -Path "dist\app.dist\app.exe" -NewName "ZarManager.exe"
          Rename-Item -Path "dist\app.dist" -NewName "ZarManager-Windows"
          
          # TRUQUE DE UX: Esconde todos os ficheiros DLLs e Pastas Feias na raiz, deixando apenas o ZarManager.exe e a pasta "bin" visíveis!
          Get-ChildItem -Path "dist\ZarManager-Windows" -File | Where-Object { $_.Name -ne 'ZarManager.exe' } | ForEach-Object { $_.Attributes = 'Hidden' }
          Get-ChildItem -Path "dist\ZarManager-Windows" -Directory | Where-Object { $_.Name -ne 'bin' } | ForEach-Object { $_.Attributes = 'Hidden' }
          
          New-Item -ItemType Directory -Force -Path release_assets
          Compress-Archive -Path "dist\ZarManager-Windows" -DestinationPath "release_assets\ZarManager-v1.2.0-Windows.zip"

      - name: Sign Windows Executable (Self-Signed Certificate)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=dfdevx2, O=ZarManager" -CertStoreLocation "Cert:\CurrentUser\My" -NotAfter (Get-Date).AddYears(5)
          Set-AuthenticodeSignature -FilePath "dist\ZarManager-Windows\ZarManager.exe" -Certificate $cert
          Write-Host "ZarManager.exe successfully signed!"

      - name: Build with Nuitka (macOS DMG)
        if: runner.os == 'macOS'
        run: |
          mkdir -p img/icon.iconset
          sips -z 16 16     img/icon.png --out img/icon.iconset/icon_16x16.png
          sips -z 32 32     img/icon.png --out img/icon.iconset/icon_16x16@2x.png
          sips -z 128 128   img/icon.png --out img/icon.iconset/icon_128x128.png
          sips -z 256 256   img/icon.png --out img/icon.iconset/icon_128x128@2x.png
          sips -z 256 256   img/icon.png --out img/icon.iconset/icon_256x256.png
          sips -z 512 512   img/icon.png --out img/icon.iconset/icon_256x256@2x.png
          iconutil -c icns img/icon.iconset
          
          python -m nuitka --standalone --macos-create-app-bundle --macos-app-icon=img/icon.icns --enable-plugin=pyside6 --include-data-dir=bin=bin --output-dir=dist app.py
          
          codesign --force --deep -s - dist/app.app
          
          HOMEBREW_NO_AUTO_UPDATE=1 brew install create-dmg
          create-dmg \
            --volname "ZarManager" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --app-drop-link 425 120 \
            "dist/ZarManager-v1.2.0-macOS.dmg" \
            "dist/app.app/" || true
            
          mkdir release_assets
          cp dist/ZarManager-v1.2.0-macOS.dmg release_assets/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release_assets/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release Draft with Changelog
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          prerelease: false
          name: ZarManager v1.2.0
          tag_name: v1.2.0
          files: |
            linux-assets/*
            windows-assets/*
            macos-assets/*
          body: |
            ## ZarManager v1.2.0 - Core Stability, Smart Updater & Collision Engine
            
            This update overhauls background architecture to provide native in-place updates, complete macOS UNIX compliance, and deep mitigation against false-positive antivirus interventions.
            
            ### Key Features & Improvements
            * **Smart In-Place Updater:** Integrated a native, asynchronous updater that downloads releases directly from GitHub, generates an OS-specific injection script, and safely restarts the application (Windows/Linux). macOS routes gracefully to the browser to ensure Gatekeeper compliance.
            * **Advanced File Collision Handling:** Operating modes no longer blindly overwrite files or cause application crashes on duplicates. A unified prompt now allows users to Overwrite, Skip, or Auto-Rename conflicting files.
            * **macOS UNIX Architecture Fixes:** Resolved fatal extraction and directory creation errors on macOS/Linux by re-engineering the extract-xiso command execution pipeline and argument structures.
            * **Surgical Security Interception:** Mitigated sudden Windows Defender crashes. The core now executes a pre-flight deep scan milliseconds before processing. If an antivirus deletes a background engine, the tool safely aborts the active thread and displays a precise tutorial for whitelisting the application.
            * **Bilingual Expansion:** Added and structured new localization keys for the collision dialogs, update sequences, and security alerts in both Portuguese and English.
            * **Windows Anti-Virus Fix:** Distributed Windows builds are now packaged as a compressed folder (`.zip`) instead of a single executable (`.exe`). This prevents extraction mechanisms that historically triggered severe false-positive alerts on Windows Defender. Internal dependencies have been visually hidden for a clean out-of-the-box user experience.
            
            ### Official Binaries
            * `ZarManager-v1.2.0-x86_64.AppImage` (Universal Linux AppImage with desktop integration)
            * `ZarManager-Linux` (Standard Linux portable binary)
            * `ZarManager-v1.2.0-Windows.zip` (Windows package containing the executable and native dependencies)
            * `ZarManager-v1.2.0-macOS.dmg` (macOS Drag-and-Drop Application Bundle)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}