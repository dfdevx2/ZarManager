name: Build and Release ZarManager

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build Executable
        run: pyinstaller ZarManager.spec
      - name: Create Zip Archive
        run: python -c "import shutil; shutil.make_archive('ZarManager-Windows', 'zip', 'dist/ZarManager')"
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Build
          path: ZarManager-Windows.zip

  build-linux:
    runs-on: ubuntu-22.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install System Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends python3-tk p7zip-full libfuse2 fuse3 desktop-file-utils wget flatpak flatpak-builder imagemagick
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build Executable
        run: pyinstaller ZarManager.spec
      - name: Create Linux Standard Zip
        run: python -c "import shutil; shutil.make_archive('ZarManager-Linux', 'zip', 'dist/ZarManager')"
        
      - name: Prepare AppImage Directory
        run: |
          mkdir -p AppDir/usr/bin
          cp -r dist/ZarManager/* AppDir/usr/bin/
          chmod +x AppDir/usr/bin/ZarManager
          
          cat <<EOF > AppDir/ZarManager.desktop
          [Desktop Entry]
          Type=Application
          Name=ZarManager
          Exec=ZarManager
          Icon=ZarManager
          Categories=Utility;
          Terminal=false
          EOF
          
          if [ -f img/icon.png ]; then
            cp img/icon.png AppDir/ZarManager.png
          elif [ -f img/icon.ico ]; then
            cp img/icon.ico AppDir/ZarManager.png
          else
            touch AppDir/ZarManager.png
          fi
          
          cat <<'EOF' > AppDir/AppRun
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          export LD_LIBRARY_PATH="${HERE}/usr/bin:${LD_LIBRARY_PATH}"
          exec "${HERE}/usr/bin/ZarManager" "$@"
          EOF
          chmod +x AppDir/AppRun
          
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run AppDir ZarManager-Linux-x86_64.AppImage

      - name: Build Flatpak Bundle
        run: |
          # 0. Gera os metadados dinamicamente para a Loja
          cat <<EOF > com.github.dfdevx2.ZarManager.desktop
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=ZarManager
          Comment=XISO extraction and compression tool
          Exec=ZarManager
          Icon=com.github.dfdevx2.ZarManager
          Terminal=false
          Categories=Utility;System;
          EOF
          
          cat <<EOF > com.github.dfdevx2.ZarManager.metainfo.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <component type="desktop-application">
            <id>com.github.dfdevx2.ZarManager</id>
            <metadata_license>CC0-1.0</metadata_license>
            <project_license>MIT</project_license>
            <name>ZarManager</name>
            <summary>Universal XISO Extraction and Compression Tool</summary>
            <description>
              <p>ZarManager is a robust, cross-platform utility designed to automate the extraction and compression of XISO files, ZIP/RAR archives, and ZAR formats.</p>
            </description>
            <launchable type="desktop-id">com.github.dfdevx2.ZarManager.desktop</launchable>
            <url type="homepage">https://github.com/dfdevx2/ZarManager</url>
            <developer_name>dfdevx2</developer_name>
            <update_contact>dfdevx2@github.com</update_contact>
          </component>
          EOF
          
          # Copia o ícone de alta resolução diretamente
          cp img/icon.png icon.png || touch icon.png
          
          # 1. Adiciona o repositório Flathub
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          
          # 2. Instalação do SDK e Plataforma
          sudo flatpak install -y flathub org.freedesktop.Platform//23.08 org.freedesktop.Sdk//23.08
          
          # 3. Constrói o Flatpak
          flatpak-builder --repo=repo --force-clean build-dir com.github.dfdevx2.ZarManager.yml
          
          # 4. Empacota num ficheiro .flatpak 
          flatpak build-bundle repo ZarManager-Linux-x86_64.flatpak com.github.dfdevx2.ZarManager

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Linux-Build
          path: |
            ZarManager-Linux.zip
            ZarManager-Linux-x86_64.AppImage
            ZarManager-Linux-x86_64.flatpak

  create-release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Artifacts
        uses: actions/download-artifact@v4
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG.md
          files: |
            Windows-Build/ZarManager-Windows.zip
            Linux-Build/ZarManager-Linux.zip
            Linux-Build/ZarManager-Linux-x86_64.AppImage
            Linux-Build/ZarManager-Linux-x86_64.flatpak
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}