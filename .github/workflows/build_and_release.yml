```yaml
name: Build and Release ZarManager

on:
  push:
    tags:
      - 'v*' # Aciona apenas quando você criar uma tag começando com 'v' (ex: v1.0.0)
  workflow_dispatch: # Permite rodar manualmente

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller customtkinter

    - name: Build with PyInstaller
      run: |
        pyinstaller ZarManager.spec --clean

    - name: Copy bin folder
      run: |
        xcopy /E /I /Y bin dist\ZarManager\bin

    - name: Zip the build
      run: |
        Compress-Archive -Path dist\ZarManager\* -DestinationPath ZarManager-Windows.zip

    - name: Upload Artifact (Windows)
      uses: actions/upload-artifact@v4
      with:
        name: ZarManager-Windows-zip
        path: ZarManager-Windows.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller customtkinter

    - name: Build with PyInstaller
      run: |
        pyinstaller ZarManager.spec --clean

    - name: Make bins executable and copy
      run: |
        chmod +x bin/extract-xiso
        chmod +x bin/zarchive
        cp -r bin dist/ZarManager/

    - name: Zip the build
      run: |
        cd dist/ZarManager && zip -r ../../ZarManager-Linux.zip ./* && cd ../..

    - name: Upload Artifact (Linux)
      uses: actions/upload-artifact@v4
      with:
        name: ZarManager-Linux-zip
        path: ZarManager-Linux.zip

  create-release:
    needs: [build-windows, build-linux] # Só roda depois que as builds terminarem
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') # Só cria release se for uma tag
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: ZarManager-Windows-zip

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: ZarManager-Linux-zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ZarManager-Windows.zip
            ZarManager-Linux.zip
          generate_release_notes: true