name: Build and Release ZarManager

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build Executable
        run: pyinstaller ZarManager.spec
      - name: Create Zip Archive
        run: Compress-Archive -Path dist\ZarManager\* -DestinationPath ZarManager-Windows.zip
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Build
          path: ZarManager-Windows.zip

  build-linux:
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk p7zip-full fuse desktop-file-utils
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller appimage-builder
      - name: Build Executable
        run: pyinstaller ZarManager.spec
      - name: Prepare AppImage Directory
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp -r dist/ZarManager/* AppDir/usr/bin/
          cp img/logo.png AppDir/usr/share/icons/hicolor/256x256/apps/zarmanager.png
          echo "[Desktop Entry]
          Type=Application
          Name=ZarManager
          Exec=ZarManager
          Icon=zarmanager
          Categories=Utility;" > AppDir/usr/share/applications/zarmanager.desktop
          wget -q https://github.com/AppImage/AppImageKit/releases/download/13/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ./appimagetool-x86_64.AppImage --appimage-extract-and-run AppDir ZarManager-Linux-x86_64.AppImage
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Linux-Build
          path: ZarManager-Linux-x86_64.AppImage

  create-release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Artifacts
        uses: actions/download-artifact@v4
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            Windows-Build/ZarManager-Windows.zip
            Linux-Build/ZarManager-Linux-x86_64.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}