name: Build and Release (Nuitka)

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20  # Evita que o GitHub Actions cancele por tempo limite

    permissions:
      contents: write

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: ZarManager-Linux
          - os: windows-latest
            artifact_name: ZarManager-Windows.exe

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nuitka

      - name: Install Linux System Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y patchelf ccache

      - name: Build with Nuitka (Linux)
        if: runner.os == 'Linux'
        run: |
          python -m nuitka --onefile --enable-plugin=pyside6 --output-dir=dist app.py

      - name: Build with Nuitka (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m nuitka --onefile --enable-plugin=pyside6 --nofollow-imports --windows-console-mode=disable --enable-plugin=pyside6 --output-dir=dist app.py

      - name: Rename Executable (Linux)
        if: runner.os == 'Linux'
        run: |
          mv dist/app.bin dist/ZarManager-Linux

      - name: Rename Executable (Windows)
        if: runner.os == 'Windows'
        run: |
          move dist\app.exe dist\ZarManager-Windows.exe

      - name: Create GitHub Release Draft
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          prerelease: false
          name: ZarManager ${{ github.ref_name }}
          files: |
            dist/ZarManager-Linux
            dist/ZarManager-Windows.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}