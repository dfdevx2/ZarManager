# 1. Apagar a tag antiga (local e remota)
git tag -d v1.2.0
git push origin --delete v1.2.0

# 2. Guardar a nova Action com a pasta padrão e os ficheiros README
git add .
git commit -m "Fix: remove hidden trick, clean bin folder and add README files for Windows"

# 3. Criar a tag novamente
git tag v1.2.0

# 4. Enviar tudo para o GitHub para acionar a Action
git push origin main
git push origin v1.2.0