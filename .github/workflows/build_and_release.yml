name: Build and Release (Nuitka)

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: linux-assets
          - os: windows-latest
            artifact_name: windows-assets
          - os: macos-latest
            artifact_name: macos-assets

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nuitka

      - name: Install Linux System Dependencies & FUSE for AppImage
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y patchelf ccache wget file libfuse2
          wget -c "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" -O appimagetool
          chmod +x appimagetool

      - name: Build with Nuitka (Linux Onefile)
        if: runner.os == 'Linux'
        run: |
          python -m nuitka --onefile --enable-plugin=pyside6 --include-data-dir=bin=bin --lto=no --output-filename=ZarManager-Linux --output-dir=dist app.py
          
          mkdir -p AppDir/usr/bin AppDir/usr/share/icons/hicolor/256x256/apps AppDir/usr/share/applications
          
          cp dist/ZarManager-Linux AppDir/usr/bin/zarmanager
          cp img/icon.png AppDir/usr/share/icons/hicolor/256x256/apps/zarmanager.png
          cp img/icon.png AppDir/zarmanager.png
          
          cat << 'EOF' > AppDir/usr/share/applications/zarmanager.desktop
          [Desktop Entry]
          Type=Application
          Name=ZarManager
          Exec=zarmanager
          Icon=zarmanager
          Categories=Utility;
          EOF
          cp AppDir/usr/share/applications/zarmanager.desktop AppDir/
          
          cat << 'EOF' > AppDir/AppRun
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/zarmanager" "$@"
          EOF
          chmod +x AppDir/AppRun
          
          ./appimagetool AppDir dist/ZarManager-v1.1.0-x86_64.AppImage
          
          mkdir -p release_assets
          cp dist/ZarManager-Linux release_assets/
          cp dist/ZarManager-v1.1.0-x86_64.AppImage release_assets/

      - name: Build with Nuitka (Windows via MinGW64)
        if: runner.os == 'Windows'
        run: |
          python -m nuitka --onefile --enable-plugin=pyside6 --include-data-dir=bin=bin --windows-console-mode=disable --assume-yes-for-downloads --lto=no --mingw64 --windows-icon-from-ico=img/icon.ico --windows-product-name="ZarManager" --windows-file-version="1.1.0.0" --windows-product-version="1.1.0.0" --windows-company-name="dfdevx2" --output-filename=ZarManager-Windows.exe --output-dir=dist app.py
          
          mkdir release_assets
          cp dist/ZarManager-Windows.exe release_assets/

      - name: Sign Windows Executable (Self-Signed Certificate)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=dfdevx2, O=ZarManager" -CertStoreLocation "Cert:\CurrentUser\My" -NotAfter (Get-Date).AddYears(5)
          Set-AuthenticodeSignature -FilePath "release_assets\ZarManager-Windows.exe" -Certificate $cert
          Write-Host "ZarManager-Windows.exe successfully signed!"

      - name: Build with Nuitka (macOS DMG)
        if: runner.os == 'macOS'
        run: |
          # Criar pasta para ícone de alta resolução
          mkdir -p img/icon.iconset
          # Usar sips nativo do Mac para gerar todas as resoluções do ícone Apple a partir do PNG original
          sips -z 16 16     img/icon.png --out img/icon.iconset/icon_16x16.png
          sips -z 32 32     img/icon.png --out img/icon.iconset/icon_16x16@2x.png
          sips -z 128 128   img/icon.png --out img/icon.iconset/icon_128x128.png
          sips -z 256 256   img/icon.png --out img/icon.iconset/icon_128x128@2x.png
          sips -z 256 256   img/icon.png --out img/icon.iconset/icon_256x256.png
          sips -z 512 512   img/icon.png --out img/icon.iconset/icon_256x256@2x.png
          iconutil -c icns img/icon.iconset
          
          python -m nuitka --standalone --macos-create-app-bundle --macos-app-icon=img/icon.icns --enable-plugin=pyside6 --include-data-dir=bin=bin --output-dir=dist app.py
          
          codesign --force --deep -s - dist/app.app
          
          brew install create-dmg
          create-dmg \
            --volname "ZarManager" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --app-drop-link 425 120 \
            "dist/ZarManager-v1.1.0-macOS.dmg" \
            "dist/app.app/"
            
          mkdir release_assets
          cp dist/ZarManager-v1.1.0-macOS.dmg release_assets/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release_assets/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release Draft with Changelog
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          prerelease: false
          name: ZarManager v1.1.0
          tag_name: v1.1.0
          files: |
            linux-assets/*
            windows-assets/*
            macos-assets/*
          body: |
            ## 🚀 ZarManager v1.1.0 - macOS Support & Enhancements
            
            This update introduces native Apple ecosystem support, UI design refinements, and community support links.
            
            ### ✨ Key Features & Improvements
            * **macOS Support (.dmg):** First official release for Apple Silicon and Intel Macs via `.dmg` image bundle, featuring native macOS UI styling, custom app icons, and ad-hoc digital signature to bypass basic Gatekeeper constraints.
            * **Ko-fi Integration:** Added a direct support button in the "About" tab for users who wish to donate and support the project's continuous development.
            * **First Boot Interactive Guide:** Implemented a welcome tutorial overlay that greets new users, explaining tabs and options to streamline onboarding.
            * **Dynamic Tooltips:** Added sleek, natively styled global tooltips across the UI. Hovering over any element explains its function precisely in real-time.
            * **Smart Threading Logic:** The engine now automatically scales down the maximum worker count to match the number of active files, eliminating ghost threads and unnecessary I/O overhead.
            * **Theme Engine Stability:** Fixed a critical bug in the Linux PySide6 rendering pipeline where changing visual themes would cause color overlaps and unreadable text. The theme foundation now safely resets the `QPalette` natively per execution.
            * **Translation & Localization:** The theme dropdown list and list views now correctly retranslate their core texts dynamically without needing an application restart.
            
            ### 📦 Official Binaries
            * `ZarManager-v1.1.0-x86_64.AppImage` (Universal Linux AppImage with desktop integration)
            * `ZarManager-Linux` (Standard Linux portable binary)
            * `ZarManager-Windows.exe` (Standalone Windows executable with embedded icon, metadata and digital signature)
            * `ZarManager-v1.1.0-macOS.dmg` (macOS Drag-and-Drop Application Bundle)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}