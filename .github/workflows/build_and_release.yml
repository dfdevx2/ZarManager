name: Build and Release ZarManager

on:
  push:
    tags:
      - 'v*'

# PERMISSÃO DE ESCRITA ADICIONADA AQUI (Resolve o erro 403)
permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build Executable
        run: pyinstaller ZarManager.spec
      - name: Create Zip Archive
        run: Compress-Archive -Path dist\ZarManager\* -DestinationPath ZarManager-Windows.zip
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Build
          path: ZarManager-Windows.zip

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install System Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk p7zip-full fuse libfuse2 desktop-file-utils
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build Executable
        run: pyinstaller ZarManager.spec
      - name: Prepare AppImage Directory
        run: |
          mkdir -p AppDir/usr/bin
          cp -r dist/ZarManager/* AppDir/usr/bin/
          
          # Cria o atalho Desktop nativo do Linux
          cat <<EOF > AppDir/ZarManager.desktop
          [Desktop Entry]
          Type=Application
          Name=ZarManager
          Exec=ZarManager
          Icon=ZarManager
          Categories=Utility;
          EOF
          
          # Lógica à prova de balas para o ícone
          if [ -f img/icon.ico ]; then
            cp img/icon.ico AppDir/ZarManager.png
          else
            touch AppDir/ZarManager.png
          fi
          
          # Cria o AppRun seguro
          cat <<'EOF' > AppDir/AppRun
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "$HERE/usr/bin/ZarManager" "$@"
          EOF
          chmod +x AppDir/AppRun
          
          # Constrói o AppImage
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.