name: Build and Release (Nuitka)

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: linux-assets
          - os: windows-latest
            artifact_name: windows-assets

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nuitka

      - name: Install Linux System Dependencies & FUSE for AppImage
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y patchelf ccache wget file libfuse2
          wget -c "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" -O appimagetool
          chmod +x appimagetool

      - name: Build with Nuitka (Linux Onefile)
        if: runner.os == 'Linux'
        run: |
          # Adicionada a flag --include-data-dir=bin=bin
          python -m nuitka --onefile --enable-plugin=pyside6 --include-data-dir=bin=bin --lto=no --output-filename=ZarManager-Linux --output-dir=dist app.py
          
          mkdir -p AppDir/usr/bin AppDir/usr/share/icons/hicolor/256x256/apps AppDir/usr/share/applications
          
          cp dist/ZarManager-Linux AppDir/usr/bin/zarmanager
          cp img/icon.png AppDir/usr/share/icons/hicolor/256x256/apps/zarmanager.png
          cp img/icon.png AppDir/zarmanager.png
          
          cat << 'EOF' > AppDir/usr/share/applications/zarmanager.desktop
          [Desktop Entry]
          Type=Application
          Name=ZarManager
          Exec=zarmanager
          Icon=zarmanager
          Categories=Utility;
          EOF
          cp AppDir/usr/share/applications/zarmanager.desktop AppDir/
          
          cat << 'EOF' > AppDir/AppRun
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/zarmanager" "$@"
          EOF
          chmod +x AppDir/AppRun
          
          ./appimagetool AppDir dist/ZarManager-v1.0.0-x86_64.AppImage
          
          mkdir -p release_assets
          cp dist/ZarManager-Linux release_assets/
          cp dist/ZarManager-v1.0.0-x86_64.AppImage release_assets/

      - name: Build with Nuitka (Windows via MinGW64)
        if: runner.os == 'Windows'
        run: |
          # Adicionada a flag --include-data-dir=bin=bin
          python -m nuitka --onefile --enable-plugin=pyside6 --include-data-dir=bin=bin --windows-console-mode=disable --assume-yes-for-downloads --lto=no --mingw64 --windows-icon-from-ico=img/icon.ico --windows-product-name="ZarManager" --windows-file-version="1.0.0.0" --windows-product-version="1.0.0.0" --windows-company-name="dfdevx2" --output-filename=ZarManager-Windows.exe --output-dir=dist app.py
          
          mkdir release_assets
          cp dist/ZarManager-Windows.exe release_assets/

      - name: Sign Windows Executable (Self-Signed Certificate)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=dfdevx2, O=ZarManager" -CertStoreLocation "Cert:\CurrentUser\My" -NotAfter (Get-Date).AddYears(5)
          Set-AuthenticodeSignature -FilePath "release_assets\ZarManager-Windows.exe" -Certificate $cert
          Write-Host "ZarManager-Windows.exe successfully signed!"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release_assets/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release Draft with Changelog
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          prerelease: false
          name: ZarManager v1.0.0
          tag_name: v1.0.0
          files: |
            linux-assets/*
            windows-assets/*
          body: |
            ## 🚀 ZarManager v1.0.0 - Stable Production Release
            
            This stable release introduces a pure PySide6 architecture, comprehensive desktop integration, repository branding assets, and optimized native binaries compiled via Nuitka.
            
            ### ✨ Key Features & Improvements
            * **Pure PySide6 Architecture:** Full removal of legacy dependencies like Flet, ensuring maximum performance, low memory footprint, and stable background multi-threading (`QThread`).
            * **Linux AppImage Support:** Generates a portable `.AppImage` bundle featuring embedded desktop icons (`img/icon.png`) and metadata integration, alongside the standard binary.
            * **Advanced Windows Build:** Embedded application icon (`img/icon.ico`), clean product metadata, and digital code signing to enhance execution reliability and minimize generic security heuristic warnings.
            * **Synchronized Versioning:** Unified version management across the main application window and the "About" tab.
            * **Reliable Batch Processing:** Advanced XISO extraction and asynchronous batch compression pipeline with built-in update check timeout feedback.
            * **AI-Assisted Debugging:** Codebase concurrency, error handling, and thread safety rigorously debugged and refined with the assistance of Artificial Intelligence.
            * **Repository Assets Integration:** Complete visual branding and icons included in the repository source and packaging pipeline.
            
            ### 📦 Official Binaries
            * `ZarManager-v1.0.0-x86_64.AppImage` (Universal Linux AppImage with desktop integration)
            * `ZarManager-Linux` (Standard Linux portable binary)
            * `ZarManager-Windows.exe` (Standalone Windows executable with embedded icon, metadata and digital signature)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}